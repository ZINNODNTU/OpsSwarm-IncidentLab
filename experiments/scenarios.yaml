scenarios:
  - id: C01
    name: Payment service crash
    description: Simulate payment process failure and unhealthy telemetry.
    service: payment
    fault: service_crash
    expected_alerts: [PaymentServiceUnhealthy]
    expected_state: unhealthy
    recovery: diagnose_and_patch
    verification: payment healthy and demomart_service_healthy=1
  - id: C02
    name: Payment error spike
    description: Raise payment error ratio above alert threshold.
    service: payment
    fault: error_rate
    value: 0.43
    expected_alerts: [PaymentErrorRateHigh]
    expected_state: degraded
    recovery: diagnose_and_patch
    verification: error rate returns to baseline
  - id: C03
    name: Bad deployment
    description: Change simulated payment version to an unhealthy deployment version.
    service: payment
    fault: bad_deployment
    value: v2.1
    expected_alerts: [PaymentDeploymentMismatch]
    expected_state: degraded
    recovery: diagnose_and_patch
    verification: service version returns to baseline
  - id: C04
    name: Database unavailable
    description: Simulate database connectivity loss.
    service: order
    fault: db_down
    value: true
    expected_alerts: [OrderDatabaseUnavailable]
    expected_state: unhealthy
    recovery: diagnose_and_patch
    verification: order healthy
  - id: C05
    name: DB connection exhaustion
    description: Exhaust simulated database connection pool.
    service: order
    fault: db_pool_exhausted
    value: true
    expected_alerts: [OrderDatabasePoolExhausted]
    expected_state: unhealthy
    recovery: diagnose_and_patch
    verification: order healthy
  - id: C06
    name: API latency
    description: Increase simulated API latency.
    service: auth
    fault: latency_ms
    value: 2000
    expected_alerts: [AuthLatencyHigh]
    expected_state: degraded
    recovery: diagnose_and_patch
    verification: latency returns to baseline
  - id: C07
    name: CPU saturation
    description: Increase simulated CPU utilization.
    service: inventory
    fault: cpu_percent
    value: 97
    expected_alerts: [InventoryCPUSaturation]
    expected_state: degraded
    recovery: diagnose_and_patch
    verification: CPU returns to baseline
  - id: C08
    name: Memory pressure
    description: Increase simulated memory utilization.
    service: inventory
    fault: memory_percent
    value: 95
    expected_alerts: [InventoryMemoryPressure]
    expected_state: degraded
    recovery: diagnose_and_patch
    verification: memory returns to baseline
  - id: C09
    name: External gateway timeout
    description: Simulate an upstream gateway timeout.
    service: payment
    fault: external_timeout
    value: true
    expected_alerts: [PaymentGatewayTimeout]
    expected_state: unhealthy
    recovery: diagnose_and_patch
    verification: payment healthy
  - id: C10
    name: Duplicate monitoring alerts
    description: Generate duplicate normalized monitoring events.
    service: payment
    fault: duplicate_alerts
    value: true
    expected_alerts: [PaymentServiceUnhealthy]
    expected_state: duplicate-events
    recovery: monitoring_deduplication
    verification: duplicate event IDs are detectable
  - id: C11
    name: Missing telemetry
    description: Remove required application telemetry while the service remains reachable.
    service: payment
    fault: telemetry_missing
    value: true
    expected_alerts: [PaymentTelemetryMissing]
    expected_state: telemetry-degraded
    recovery: diagnose_and_patch
    verification: telemetry_present returns to 1
  - id: C12
    name: False recovery
    description: Keep payment error rate elevated after a recovery-looking transition.
    service: payment
    fault: error_rate
    value: 0.43
    expected_alerts: [PaymentErrorRateHigh]
    expected_state: degraded
    recovery: diagnose_and_patch
    verification: independent health and metrics remain degraded until reset
