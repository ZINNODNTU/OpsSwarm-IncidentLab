global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: demomart
    static_configs:
      - targets: ["auth:8000","order:8000","inventory:8000","payment:8000","booking-api:8000"]
