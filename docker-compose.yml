services:
  openclaw-init:
    build:
      context: .
      dockerfile: platform/openclaw/Dockerfile
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.9.6}
    image: opsswarm-openclaw:2026.9.6
    user: "0:0"
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        mkdir -p /home/node/.openclaw &&
        cp /bootstrap/openclaw.json /home/node/.openclaw/openclaw.json &&
        chown -R 1000:1000 /home/node/.openclaw
    volumes:
      - openclaw-state:/home/node/.openclaw
      - ./platform/openclaw/openclaw.json:/bootstrap/openclaw.json:ro
    restart: "no"

  openclaw:
    build:
      context: .
      dockerfile: platform/openclaw/Dockerfile
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.9.6}
    image: opsswarm-openclaw:2026.9.6
    init: true
    command: ["openclaw", "gateway", "run", "--bind", "lan", "--port", "18789"]
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      OPENCLAW_STATE_DIR: /home/node/.openclaw
    volumes:
      - openclaw-state:/home/node/.openclaw
      - ./platform/openclaw/workspaces:/opt/opsswarm/workspaces:ro
      - ./platform/openclaw/skills:/opt/opsswarm/skills:ro
      - ./:/opt/opsswarm/workspaces/opsswarm-incident-manager/project:ro
      - ./:/opt/opsswarm/workspaces/opsswarm-observability-investigator/project:ro
      - ./:/opt/opsswarm/workspaces/opsswarm-application-investigator/project:ro
      - ./:/opt/opsswarm/workspaces/opsswarm-infrastructure-investigator/project:ro
      - ./:/opt/opsswarm/workspaces/opsswarm-database-investigator/project:ro
      - ./:/opt/opsswarm/workspaces/opsswarm-recovery-responder/project:rw
      - ./:/opt/opsswarm/workspaces/opsswarm-communications-postmortem/project:ro
      - ./platform/openclaw/blocked.env:/opt/opsswarm/workspaces/opsswarm-incident-manager/project/.env:ro
      - ./platform/openclaw/blocked.env:/opt/opsswarm/workspaces/opsswarm-observability-investigator/project/.env:ro
      - ./platform/openclaw/blocked.env:/opt/opsswarm/workspaces/opsswarm-application-investigator/project/.env:ro
      - ./platform/openclaw/blocked.env:/opt/opsswarm/workspaces/opsswarm-infrastructure-investigator/project/.env:ro
      - ./platform/openclaw/blocked.env:/opt/opsswarm/workspaces/opsswarm-database-investigator/project/.env:ro
      - ./platform/openclaw/blocked.env:/opt/opsswarm/workspaces/opsswarm-recovery-responder/project/.env:ro
      - ./platform/openclaw/blocked.env:/opt/opsswarm/workspaces/opsswarm-communications-postmortem/project/.env:ro
      - ./runtime-data:/opt/opsswarm/workspaces/opsswarm-recovery-responder/project/runtime-data:ro
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  opsswarm:
    build:
      context: .
      dockerfile: platform/opsswarm/Dockerfile
    command:
      - uvicorn
      - opsswarm.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8088"
      - --reload
      - --reload-dir
      - /app/opsswarm
    environment:
      PYTHONUNBUFFERED: "1"
      GITHUB_REPO: ${GITHUB_REPO:-ZINNODNTU/OpsSwarm-IncidentLab}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      OPSWARM_CONFIG: /app/config/incidentlab-demo.yaml
      OPSWARM_DATA_DIR: /app/runtime-data
      OPSWARM_GITHUB_POLL_ENABLED: ${OPSWARM_GITHUB_POLL_ENABLED:-true}
      OPSWARM_GITHUB_POLL_SECONDS: ${OPSWARM_GITHUB_POLL_SECONDS:-2}
      OPSWARM_OPENCLAW_HTTP_URL: http://openclaw:18789
      OPSWARM_OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPSWARM_OPENCLAW_HTTP_REQUIRED: "true"
      OPSWARM_OPENCLAW_TIMEOUT: ${OPSWARM_OPENCLAW_TIMEOUT:-600}
    volumes:
      - ./runtime-data/opsswarm:/app/runtime-data
      - ./platform/opsswarm/opsswarm:/app/opsswarm:rw
      - ./platform/opsswarm/config:/app/config:ro
    ports:
      - "${OPSSWARM_PORT:-8088}:8088"
    depends_on:
      openclaw:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  incidentlab:
    build:
      context: .
      dockerfile: incidentlab/Dockerfile
    command:
      - uvicorn
      - incidentlab.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
      - --reload-dir
      - /app/incidentlab
    ports:
      - "${INCIDENTLAB_PORT:-8080}:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      AUTH_URL: http://auth:8000
      ORDER_URL: http://order:8000
      INVENTORY_URL: http://inventory:8000
      PAYMENT_URL: http://payment:8000
      BOOKING_API_URL: http://booking-api:8000
      INCIDENTLAB_DATA_DIR: /app/runtime-data/incidentlab
      INCIDENTLAB_PUBLIC_URL: ${INCIDENTLAB_AGENT_URL:-http://incidentlab:8080}
      INCIDENTLAB_FALLBACK_URL: ${INCIDENTLAB_FALLBACK_URL:-http://incidentlab:8080}
      OPSSWARM_URL: http://opsswarm:8088
      GITHUB_REPO: ${GITHUB_REPO:-ZINNODNTU/OpsSwarm-IncidentLab}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./runtime-data:/app/runtime-data
      - ./incidentlab:/app/incidentlab:rw
      - ./experiments:/app/experiments:rw
    depends_on:
      opsswarm:
        condition: service_healthy
      auth:
        condition: service_healthy
      order:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payment:
        condition: service_healthy
      booking-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  auth:
    build: ./services
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]
    environment: {SERVICE_NAME: auth, DEFAULT_VERSION: v1.0, STATE_DIR: /app/state}
    volumes:
      - ./runtime-data/service-state/auth:/app/state
      - ./services/app.py:/app/app.py:rw
    ports: ["${AUTH_PORT:-8001}:8000"]
    healthcheck: &service-health
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 2s
      retries: 2
      start_period: 5s

  order:
    build: ./services
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]
    environment: {SERVICE_NAME: order, DEFAULT_VERSION: v1.0, STATE_DIR: /app/state}
    volumes:
      - ./runtime-data/service-state/order:/app/state
      - ./services/app.py:/app/app.py:rw
    ports: ["${ORDER_PORT:-8002}:8000"]
    healthcheck: *service-health

  inventory:
    build: ./services
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]
    environment: {SERVICE_NAME: inventory, DEFAULT_VERSION: v1.0, STATE_DIR: /app/state}
    volumes:
      - ./runtime-data/service-state/inventory:/app/state
      - ./services/app.py:/app/app.py:rw
    ports: ["${INVENTORY_PORT:-8003}:8000"]
    healthcheck: *service-health

  payment:
    build: ./services
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]
    environment: {SERVICE_NAME: payment, DEFAULT_VERSION: v2.0, STATE_DIR: /app/state}
    volumes:
      - ./runtime-data/service-state/payment:/app/state
      - ./services/app.py:/app/app.py:rw
    ports: ["${PAYMENT_PORT:-8004}:8000"]
    healthcheck: *service-health

  booking-api:
    build: ./services
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]
    environment: {SERVICE_NAME: booking-api, DEFAULT_VERSION: v2.0, STATE_DIR: /app/state}
    volumes:
      - ./runtime-data/service-state/booking-api:/app/state
      - ./services/app.py:/app/app.py:rw
    ports: ["${BOOKING_API_PORT:-8005}:8000"]
    healthcheck: *service-health

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.path=/prometheus","--web.enable-lifecycle"]
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
    depends_on:
      auth: {condition: service_healthy}
      order: {condition: service_healthy}
      inventory: {condition: service_healthy}
      payment: {condition: service_healthy}
      booking-api: {condition: service_healthy}
      alertmanager: {condition: service_started}
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./infrastructure/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["${ALERTMANAGER_PORT:-9093}:9093"]
    restart: unless-stopped

volumes:
  openclaw-state:
